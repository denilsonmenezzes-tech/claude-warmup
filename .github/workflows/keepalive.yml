name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reativar workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tenta pelo nome de exibição
          gh workflow enable "Aquecimento do Claude Code" || true
          
          # Tenta pelos nomes de arquivo mais comuns
          gh workflow enable "warmup.yml" || true
          gh workflow enable "claude-warmup.yml" || true
          gh workflow enable "aquecimento.yml" || true
          gh workflow enable "claude.yml" || true
          
          # Lista todos os workflows para ver os nomes reais
          echo "=== Workflows disponíveis ==="
          gh workflow list
