name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'   # Roda todo dia 1 de cada mês às 00:00 UTC
  workflow_dispatch:       # Também permite rodar manualmente

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reativar workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable "Aquecimento do Claude Code"
