name: Aquecimento do Claude Code

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: Aquecimento Claude
  cancel-in-progress: true

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar configuracao
        env:
          CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_OAUTH_TOKEN" ]; then
            echo "Segredo CLAUDE_OAUTH_TOKEN nao esta definido."
            echo "Adicione em Configurações > Segredos e variáveis > Ações."
            exit 1
          fi

      - name: Instalar o Codigo Claude
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude para a janela de 5 horas de ancoragem
        env:
          CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          output_file="$(mktemp)"
          set +e
          claude -p "hi" --model haiku --no-session-persistence >"$output_file" 2>&1
          status=$?
          set -e
          cat "$output_file"

          if [ $status -eq 0 ]; then
            echo "Pedido de aquecimento do Claude bem-sucedido."
            echo "✓ Aquecimento completo"
            exit 0
          fi

          if grep -Eiq "expired|unauthorized|valid token|authentication|auth failed|login required" "$output_file"; then
            echo "O token Claude aparece invalido ou expirado."
            echo "Execute 'claude setup-token' localmente e atualize o segredo CLAUDE_OAUTH_TOKEN no GitHub."
            exit 1
          fi

          if grep -qi "rate limit" "$output_file"; then
            echo "Claude relatou um limite de taxa; tratando como sucesso no aquecimento."
            echo "✓ Aquecimento completo"
            exit 0
          fi

          echo "Claude no aquecimento falhou com um erro inesperado."
          exit $status
